<title>Sonnenhof Vorschau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen pannable farm world, floating HUD top, action bar bottom, bottom-sheet panels */
:root{
  --grass:#7dbb4a; --grass-dark:#5f9a35; --wood:#8a5a2b; --wood-light:#c98b4b;
  --cream:#fff7e6; --ink:#4a2f17; --gold:#f5b82e; --sky:#4fb3e8; --berry:#e2574c;
  --font:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important}
body{margin:0;background:var(--grass);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:
   radial-gradient(ellipse 60px 34px at 20% 30%,rgba(255,255,255,.07),transparent 70%),
   radial-gradient(ellipse 90px 50px at 70% 60%,rgba(0,0,0,.05),transparent 70%),
   radial-gradient(circle at 50% 50%,#86c454 0%,#78b546 60%,#6aa83d 100%);
  background-size:220px 160px,300px 210px,100% 100%;}
#view.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1000px;height:800px;transform-origin:0 0;}
#ground{position:absolute;inset:0;}
.ent{position:absolute;cursor:pointer;}
.ent img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;}
.field img{transition:filter .6s ease;}
.field.growing img{filter:hue-rotate(48deg) saturate(.85) brightness(1.05);}
.field.ready img{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 90%;}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(-1.2deg)}}
.ent:hover img{filter:brightness(1.07) drop-shadow(0 0 6px rgba(255,255,220,.8));}
.field.growing:hover img{filter:hue-rotate(48deg) saturate(.85) brightness(1.12) drop-shadow(0 0 6px rgba(255,255,220,.8));}
.cow img{transform-origin:50% 95%;}
.cow.squash img{animation:squash .45s ease;}
@keyframes squash{30%{transform:scale(1.08,.9)}65%{transform:scale(.96,1.06)}100%{transform:scale(1)}}
.bakery.pop img,.field.pop img{animation:squash .45s ease;}

.timer{position:absolute;left:50%;transform:translateX(-50%);background:rgba(74,47,23,.82);color:#fff;
  font-weight:600;font-size:15px;padding:3px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;}
.timer .tbar{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--gold);}
.bubble{position:absolute;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:50%;
  background:var(--cream);box-shadow:0 4px 0 #d9c4a0,0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center;
  animation:bob 1.4s ease-in-out infinite;pointer-events:none;}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--cream);}
.bubble svg{width:36px;height:36px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.smoke{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.85);
  pointer-events:none;animation:smoke 2.4s linear infinite;opacity:0}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-70px) scale(1.8);opacity:0}}

.float{position:absolute;font-weight:700;font-size:26px;color:#fff;pointer-events:none;
  text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);animation:rise 1.1s ease-out forwards;z-index:5000;
  display:flex;align-items:center;gap:4px;}
.float svg{width:30px;height:30px}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.flyer{position:fixed;width:34px;height:34px;pointer-events:none;z-index:9000;transition:transform .8s cubic-bezier(.5,-.3,.7,1),opacity .8s;}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;z-index:100;}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(74,47,23,.78);color:#fff;
  border:3px solid rgba(255,255,255,.85);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:18px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums;}
.pill svg{width:34px;height:34px;flex:none}
.lvl{position:relative;display:grid;place-items:center;width:40px;height:40px;flex:none}
.lvl svg{position:absolute;inset:0;width:40px;height:40px}
.lvl b{position:relative;font-size:17px;color:var(--ink);margin-top:2px}
.xp{width:96px;height:12px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(#9fe06a,#5cb82f);border-radius:6px;transition:width .5s}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:center;gap:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.btn{pointer-events:auto;position:relative;border:0;font-family:var(--font);font-weight:600;font-size:15px;color:var(--ink);
  background:linear-gradient(#fff7e6,#f3dfb8);border-radius:18px;padding:8px 14px 10px;min-width:84px;
  box-shadow:0 5px 0 #b88a52,0 8px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b88a52,0 4px 8px rgba(0,0,0,.25)}
.btn:focus-visible,.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn svg{width:34px;height:34px}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--berry);
  color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}

/* Sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.card{pointer-events:auto;width:100%;max-width:520px;background:var(--cream);border:4px solid var(--wood-light);
  border-radius:24px;box-shadow:0 8px 0 var(--wood),0 18px 40px rgba(0,0,0,.35);padding:16px 18px 18px;
  animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--berry);color:#fff;width:34px;height:34px;border-radius:50%;font:700 18px var(--font);
  box-shadow:0 3px 0 #a8352c;cursor:pointer;flex:none}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;border:2px solid #f0dfbf}
.rows{display:flex;flex-direction:column;gap:10px}
.items{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.it{display:flex;align-items:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums}
.it svg{width:30px;height:30px}
.it.miss{color:var(--berry)}
.cta{border:0;font:600 16px var(--font);color:#fff;background:linear-gradient(#7fd04b,#4fa524);border-radius:14px;
  padding:8px 14px;box-shadow:0 4px 0 #3a7d18;cursor:pointer;white-space:nowrap}
.cta:disabled{background:#cbbfa8;box-shadow:0 4px 0 #a89c86;cursor:default}
.reward{font-size:14px;color:#8a6a45;display:flex;gap:10px}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;height:58px;border-radius:14px;border:2px dashed #e0c99f;display:grid;place-items:center;font-size:13px;color:#a08560;font-variant-numeric:tabular-nums}
.slot.busy{border-style:solid;background:#fff}
.slot.done{border-style:solid;background:#fff3cc;border-color:var(--gold)}
.slot svg{width:30px;height:30px}
.note{font-size:13px;color:#8a6a45;margin:10px 2px 0}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv .row{flex-direction:column;gap:4px;font-size:18px}
.inv svg{width:44px;height:44px}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:300;
  background:rgba(74,47,23,.9);color:#fff;font-weight:600;padding:8px 18px;border-radius:999px;font-size:16px;
  max-width:calc(100% - 32px);text-align:center;animation:up .25s ease-out}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:90;
  background:rgba(255,247,230,.95);border:3px solid var(--wood-light);border-radius:16px;padding:8px 14px;font-size:14px;
  max-width:min(440px,calc(100% - 32px));text-align:center;box-shadow:0 4px 0 var(--wood);line-height:1.35}
.levelup{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(40,25,10,.45)}
.levelup .card{text-align:center;max-width:320px}
.levelup .big{font-size:56px;font-weight:700;color:var(--gold);text-shadow:0 3px 0 var(--wood)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:420px){.btn{min-width:0;padding:6px 10px 8px;font-size:13px}.xp{width:64px}.pill{font-size:16px}}
</style>

<div id="view"><div id="world"><canvas id="ground" width="1000" height="800"></canvas></div></div>

<div class="hud">
  <div class="pill" title="Level und Erfahrung">
    <div class="lvl"><svg viewBox="0 0 40 40"><path d="M20 2l5.3 11.3 12.2 1.4-9 8.4 2.4 12.1L20 29.3 9.1 35.2l2.4-12.1-9-8.4 12.2-1.4z" fill="#f5b82e" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg><b id="lvl">1</b></div>
    <div class="xp"><i id="xpbar"></i></div>
  </div>
  <div class="pill" title="Münzen"><svg viewBox="0 0 34 34" data-i="coin"></svg><span id="coins">0</span></div>
</div>

<div class="hint" id="hint">Vorschau mit deinen 3 Gemini-Bildern. Tippe auf Felder, Kühe und die Bäckerei. Ziehen verschiebt die Ansicht.</div>

<div class="bar">
  <button class="btn" id="bOrders"><svg viewBox="0 0 34 34" data-i="board"></svg>Aufträge<span class="badge" id="ordBadge" hidden>0</span></button>
  <button class="btn" id="bInv"><svg viewBox="0 0 34 34" data-i="barn"></svg>Lager</button>
  <button class="btn" id="bBuild"><svg viewBox="0 0 34 34" data-i="hammer"></svg>Bauen</button>
</div>
<div id="sheetHost"></div>

<script>
const IMG={wheat:"data:image/webp;base64,__WHEAT__",bakery:"data:image/webp;base64,__BAKERY__",cow:"data:image/webp;base64,__COW__"};
const ICON={
 coin:'<circle cx="17" cy="17" r="14" fill="#f5b82e" stroke="#c98a12" stroke-width="3"/><circle cx="17" cy="17" r="8.5" fill="none" stroke="#ffe08a" stroke-width="2.5"/><path d="M17 11v12" stroke="#c98a12" stroke-width="3" stroke-linecap="round"/>',
 wheat:'<g stroke="#b9821c" stroke-width="1.6"><path d="M17 31V12" stroke="#7d9a2e" stroke-width="2.4"/><path d="M17 31L10 15M17 31l7-16" stroke="#7d9a2e" stroke-width="2.2"/></g><g fill="#f2c043" stroke="#c48d1f" stroke-width="1.3"><ellipse cx="17" cy="6.5" rx="3" ry="5"/><ellipse cx="13.5" cy="12" rx="2.6" ry="4.2" transform="rotate(-25 13.5 12)"/><ellipse cx="20.5" cy="12" rx="2.6" ry="4.2" transform="rotate(25 20.5 12)"/><ellipse cx="9" cy="11" rx="2.6" ry="4.4" transform="rotate(-25 9 11)"/><ellipse cx="25" cy="11" rx="2.6" ry="4.4" transform="rotate(25 25 11)"/></g>',
 bread:'<path d="M4 20c0-7 6-11 13-11s13 4 13 11c0 3-2 5-5 5H9c-3 0-5-2-5-5z" fill="#e0a052" stroke="#9c5f22" stroke-width="2.2"/><path d="M10 14l3 5M16 12l2 6M22 13l2 5" stroke="#f7d79a" stroke-width="2.4" stroke-linecap="round"/>',
 milk:'<path d="M12 4h10v4l3 5v16a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V13l3-5z" fill="#fff" stroke="#6b8db5" stroke-width="2.2" stroke-linejoin="round"/><path d="M9.5 18h15v7h-15z" fill="#7fb6e8"/><rect x="11.5" y="2.5" width="11" height="4" rx="1.5" fill="#4f86c6"/>',
 star:'<path d="M17 3l4.2 8.9 9.6 1.1-7.1 6.6 1.9 9.5L17 24.3l-8.6 4.8 1.9-9.5-7.1-6.6 9.6-1.1z" fill="#8fd65a" stroke="#4f9a24" stroke-width="2" stroke-linejoin="round"/>',
 board:'<rect x="4" y="6" width="26" height="20" rx="3" fill="#c98b4b" stroke="#8a5a2b" stroke-width="2.2"/><rect x="8" y="10" width="8" height="6" fill="#fff7e6"/><rect x="18" y="10" width="8" height="10" fill="#fff7e6"/><rect x="8" y="18" width="8" height="4" fill="#fff7e6"/><path d="M10 26l-2 5M24 26l2 5" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>',
 barn:'<path d="M4 15L17 5l13 10v15H4z" fill="#e2574c" stroke="#a8352c" stroke-width="2.2" stroke-linejoin="round"/><rect x="12" y="19" width="10" height="11" fill="#fff7e6" stroke="#a8352c" stroke-width="2"/><path d="M12 19l10 11M22 19L12 30" stroke="#a8352c" stroke-width="1.6"/>',
 hammer:'<path d="M15 14l14 14-3 3-14-14z" fill="#c98b4b" stroke="#8a5a2b" stroke-width="2" stroke-linejoin="round"/><path d="M6 9l7-6 8 6-4 4-3-2-4 4z" fill="#9aa6b2" stroke="#5d6873" stroke-width="2" stroke-linejoin="round"/>'
};
const ico=(n)=>`<svg viewBox="0 0 34 34">${ICON[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(s=>s.innerHTML=ICON[s.dataset.i]);
const NAMES={wheat:'Weizen',bread:'Brot',milk:'Milch'};
const GROW=20000,MILK=15000,BAKE=12000,BREAD_COST=2,QMAX=3;

/* ---------- state ---------- */
function fresh(){const t=Date.now();return{
  coins:120,xp:0,level:1,inv:{wheat:2,bread:0,milk:0},
  fields:Array.from({length:6},(_,i)=>({readyAt:i<4?0:t+6000+i*2500})),
  cows:[{readyAt:0},{readyAt:t+5000},{readyAt:t+9000}],
  bakery:{queue:[],done:0},
  orders:[newOrder(1),newOrder(1),newOrder(1)],
  seen:false}}
function newOrder(lvl){
  const pool=['wheat','bread','milk'];const n=Math.random()<.5?1:2;const items={};
  pool.sort(()=>Math.random()-.5).slice(0,n).forEach(k=>items[k]=1+Math.floor(Math.random()*(k==='bread'?2:3)));
  let val=0;for(const k in items)val+=items[k]*({wheat:4,bread:14,milk:9}[k]);
  return{items,coins:Math.round(val*1.4+lvl*3),xp:Math.round(val/3)+2};
}
let S;
try{S=JSON.parse(localStorage.getItem('sonnenhof')||'null')}catch(e){S=null}
if(window.claude?.hot?.data?.S)S=window.claude.hot.data.S;
if(!S||!S.fields)S=fresh();
window.claude?.hot?.snapshot?.(()=>({S}));
function save(){try{localStorage.setItem('sonnenhof',JSON.stringify(S))}catch(e){}}

/* ---------- world ---------- */
const world=document.getElementById('world'),view=document.getElementById('view');
const ents=[];
function place(kind,x,y,w,i){
  const el=document.createElement('div');el.className='ent '+kind;
  el.style.left=(x-w/2)+'px';el.style.width=w+'px';el.style.zIndex=Math.round(y);
  el.innerHTML=`<img src="${IMG[kind==='field'?'wheat':kind]}" alt="">`;
  world.appendChild(el);
  const img=el.firstChild;const setTop=()=>{el.style.top=(y-el.offsetHeight)+'px'};
  img.complete?setTop():img.onload=setTop;
  const e={kind,i,el,x,y,w};ents.push(e);return e;
}
for(let i=0;i<2;i++)for(let j=0;j<3;j++)place('field',300+(j-i)*104,320+(i+j)*56,200,ents.filter(e=>e.kind==='field').length);
const bak=place('bakery',745,390,270,0);
[[600,650,150],[800,705,150],[420,700,140]].forEach(([x,y,w],i)=>place('cow',x,y,w,i));

/* ground canvas: path, tufts, flowers, bushes */
(function(){
  const c=document.getElementById('ground'),g=c.getContext('2d');let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  // dirt path
  g.lineCap='round';g.lineJoin='round';
  const path=[[760,395],[740,470],[690,540],[700,620],[690,700],[700,800]];
  const stroke=(w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();path.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));g.stroke()};
  stroke(70,'#c9a873');stroke(58,'#dcc08b');
  for(let k=0;k<70;k++){const t=r()*(path.length-1),a=Math.floor(t),f=t-a,p=path[a],q=path[a+1]||p;
    const x=p[0]+(q[0]-p[0])*f+(r()-.5)*40,y=p[1]+(q[1]-p[1])*f+(r()-.5)*20;
    g.fillStyle=r()<.5?'#cfb07a':'#e8d3a4';g.beginPath();g.ellipse(x,y,6+r()*7,4+r()*4,0,0,7);g.fill()}
  // soil shadow under fields
  g.fillStyle='rgba(60,90,20,.18)';g.beginPath();g.ellipse(300,410,270,140,0,0,7);g.fill();
  // tufts
  for(let k=0;k<420;k++){const x=r()*1000,y=r()*800;g.strokeStyle=r()<.5?'#5f9a35':'#9fd168';g.lineWidth=2;
    for(let b=-1;b<=1;b++){g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+b*3,y-5,x+b*5,y-9-r()*4);g.stroke()}}
  // flowers
  const fc=['#fff','#ffd84d','#ff9fb2','#c9a2ff'];
  for(let k=0;k<90;k++){const x=r()*1000,y=r()*800;if(Math.hypot(x-300,(y-410)*1.8)<300)continue;
    g.fillStyle=fc[k%4];for(let p=0;p<5;p++){const a=p*1.257;g.beginPath();g.arc(x+Math.cos(a)*3,y+Math.sin(a)*3,2.4,0,7);g.fill()}
    g.fillStyle='#f5b82e';g.beginPath();g.arc(x,y,1.8,0,7);g.fill()}
  // bushes / round trees
  const bush=(x,y,s)=>{g.fillStyle='rgba(30,60,10,.25)';g.beginPath();g.ellipse(x,y+4,46*s,16*s,0,0,7);g.fill();
    [[-26,-18,26],[24,-16,28],[0,-36,32],[-6,-10,30]].forEach(([dx,dy,rr])=>{
      const gr=g.createRadialGradient(x+dx*s-8*s,y+dy*s-10*s,4,x+dx*s,y+dy*s,rr*s);
      gr.addColorStop(0,'#9bd35c');gr.addColorStop(.7,'#5e9d2e');gr.addColorStop(1,'#457a20');
      g.fillStyle=gr;g.beginPath();g.arc(x+dx*s,y+dy*s,rr*s,0,7);g.fill()});
    g.fillStyle='#e2574c';for(let b=0;b<4;b++){g.beginPath();g.arc(x+(r()-.5)*60*s,y-20*s-r()*30*s,3.2*s,0,7);g.fill()}};
  [[70,170,1.1],[930,560,1],[90,690,1.2],[955,240,.9],[540,150,.8],[880,780,1.1],[260,780,.9],[30,430,.9]].forEach(b=>bush(...b));
  // fence around fields
  g.strokeStyle='#8a5a2b';g.lineWidth=5;const fence=[[40,330],[300,185],[590,345]];
  g.beginPath();fence.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
  g.strokeStyle='#c98b4b';g.lineWidth=3;g.beginPath();fence.forEach(([x,y],k)=>k?g.lineTo(x,y-12):g.moveTo(x,y-12));g.stroke();
  for(let s=0;s<2;s++){const [a,b]=[fence[s],fence[s+1]];for(let t=0;t<=1.001;t+=1/7){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
    g.fillStyle='#8a5a2b';g.fillRect(x-4,y-24,8,28);g.fillStyle='#c98b4b';g.fillRect(x-4,y-24,4,26)}}
})();

/* overlays per entity */
ents.forEach(e=>{e.ov=document.createElement('div');e.ov.style.cssText='position:absolute;left:0;right:0;top:0;height:0;pointer-events:none';e.el.appendChild(e.ov)});
const smokeHost=document.createElement('div');smokeHost.style.cssText='position:absolute;pointer-events:none';bak.el.appendChild(smokeHost);
for(let k=0;k<3;k++){const s=document.createElement('div');s.className='smoke';s.style.cssText=`left:${0.68*270}px;top:${0.07*286}px;animation-delay:${k*.8}s`;smokeHost.appendChild(s)}

/* ---------- camera ---------- */
let cam={s:1,x:0,y:0};
function fit(){const W=innerWidth,H=innerHeight;
  const s=W<H?Math.max(W/1000,H/800*0.72):Math.max(W/1000,H/800);
  cam.s=s;cam.x=(W-1000*s)/2;cam.y=(H-800*s)/2+ (W<H?0:10);clamp();apply()}
function clamp(){const W=innerWidth,H=innerHeight,w=1000*cam.s,h=800*cam.s;
  cam.x=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,cam.x));cam.y=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,cam.y))}
function apply(){world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`}
addEventListener('resize',fit);fit();
let drag=null,moved=false;
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>6){moved=true;view.classList.add('dragging')}
  if(moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;clamp();apply()}});
addEventListener('pointerup',()=>{drag=null;view.classList.remove('dragging')});

/* ---------- helpers ---------- */
const now=()=>Date.now();
const fmt=ms=>{const s=Math.ceil(ms/1000);return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+' s'};
function floatAt(e,html){const f=document.createElement('div');f.className='float';f.innerHTML=html;
  f.style.left=(e.x-30)+'px';f.style.top=(e.y-(e.el.offsetHeight*.8))+'px';world.appendChild(f);setTimeout(()=>f.remove(),1150)}
function fly(e,item,target){const r=e.el.getBoundingClientRect(),t=document.getElementById(target).getBoundingClientRect();
  const f=document.createElement('div');f.className='flyer';f.innerHTML=ico(item);
  f.style.left=(r.left+r.width/2-17)+'px';f.style.top=(r.top+r.height*.3)+'px';document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${t.left+t.width/2-(r.left+r.width/2)}px,${t.top+t.height/2-(r.top+r.height*.3)-17}px) scale(.7)`;f.style.opacity=.3}));
  setTimeout(()=>f.remove(),850)}
function pop(e){e.el.classList.remove('pop','squash');void e.el.offsetWidth;e.el.classList.add(e.kind==='cow'?'squash':'pop')}
let toastT;function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');
  t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
function addXP(n){S.xp+=n;let need=S.level*12;while(S.xp>=need){S.xp-=need;S.level++;need=S.level*12;levelUp()}}
function levelUp(){const d=document.createElement('div');d.className='levelup';
  d.innerHTML=`<div class="card"><div class="big">Level ${S.level}</div><p>Dein Hof wächst. Neue Aufträge bringen jetzt mehr Münzen.</p><button class="cta" id="lvOk">Weiter</button></div>`;
  document.body.appendChild(d);d.querySelector('#lvOk').onclick=()=>d.remove()}
function hideHint(){if(!S.seen){S.seen=true;document.getElementById('hint').hidden=true}}
if(S.seen)document.getElementById('hint').hidden=true;

/* ---------- interactions ---------- */
ents.forEach(e=>e.el.addEventListener('click',ev=>{if(moved)return;ev.stopPropagation();hideHint();act(e)}));
function act(e){
  const t=now();
  if(e.kind==='field'){const f=S.fields[e.i];
    if(f.readyAt<=t){S.inv.wheat+=2;f.readyAt=t+GROW;addXP(1);pop(e);floatAt(e,'+2 '+ico('wheat'));fly(e,'wheat','bInv')}
    else toast('Der Weizen wächst noch '+fmt(f.readyAt-t))}
  else if(e.kind==='cow'){const c=S.cows[e.i];
    if(c.readyAt<=t){S.inv.milk+=1;c.readyAt=t+MILK;addXP(1);pop(e);floatAt(e,'+1 '+ico('milk'));fly(e,'milk','bInv')}
    else{pop(e);toast('Die Kuh gibt in '+fmt(c.readyAt-t)+' wieder Milch')}}
  else if(e.kind==='bakery'){if(S.bakery.done>0){collectBread();}else openBakery()}
  save();render()
}
function collectBread(){const n=S.bakery.done;S.inv.bread+=n;S.bakery.done=0;addXP(2*n);pop(bak);floatAt(bak,'+'+n+' '+ico('bread'));fly(bak,'bread','bInv')}
function tickBakery(){const q=S.bakery.queue,t=now();while(q.length&&q[0]<=t){q.shift();S.bakery.done++;}}

/* ---------- sheets ---------- */
let sheet=null;const host=document.getElementById('sheetHost');
function close(){sheet=null;host.innerHTML='';}
function open(kind){sheet=kind;renderSheet()}
function openBakery(){open('bakery')}
document.getElementById('bOrders').onclick=()=>{hideHint();sheet==='orders'?close():open('orders')};
document.getElementById('bInv').onclick=()=>{hideHint();sheet==='inv'?close():open('inv')};
document.getElementById('bBuild').onclick=()=>toast('Bauen kommt im fertigen Spiel: Häuser, Fabriken, Deko');
view.addEventListener('click',()=>{if(!moved&&sheet)close()});
const has=(items)=>Object.keys(items).every(k=>S.inv[k]>=items[k]);
function itemsHTML(items,check){return Object.entries(items).map(([k,v])=>`<span class="it ${check&&S.inv[k]<v?'miss':''}" title="${NAMES[k]}">${ico(k)}${check?Math.min(S.inv[k],v)+'/'+v:v}</span>`).join('')}
function renderSheet(){
  if(!sheet){host.innerHTML='';return}
  let body='';const t=now();
  if(sheet==='orders'){
    body=`<div class="head"><h2>Aufträge</h2><button class="x" data-a="close" aria-label="Schließen">✕</button></div><div class="rows">`+
    S.orders.map((o,i)=>`<div class="row"><div class="items">${itemsHTML(o.items,true)}</div>
      <div class="reward"><span class="it">${ico('coin')}${o.coins}</span><span class="it">${ico('star')}${o.xp}</span></div>
      <button class="cta" data-a="deliver" data-i="${i}" ${has(o.items)?'':'disabled'}>Liefern</button></div>`).join('')+
    `</div><p class="note">Erntet Weizen, melkt Kühe und backt Brot, um Aufträge zu erfüllen.</p>`}
  else if(sheet==='inv'){
    body=`<div class="head"><h2>Lager</h2><button class="x" data-a="close" aria-label="Schließen">✕</button></div><div class="inv">`+
    ['wheat','bread','milk'].map(k=>`<div class="row">${ico(k)}<b>${S.inv[k]}</b><span style="font-size:14px">${NAMES[k]}</span></div>`).join('')+`</div>`}
  else if(sheet==='bakery'){const q=S.bakery.queue;
    const slots=[];for(let k=0;k<QMAX;k++){
      if(k<S.bakery.done)slots.push(`<div class="slot done">${ico('bread')}</div>`);
      else{const qi=k-S.bakery.done;if(qi<q.length){const start=qi===0?q[0]-BAKE:q[qi-1];const left=q[qi]-t;
        slots.push(`<div class="slot busy">${qi===0?fmt(left):'wartet'}</div>`)}else slots.push(`<div class="slot">frei</div>`)}}
    const can=S.inv.wheat>=BREAD_COST&&q.length+S.bakery.done<QMAX;
    body=`<div class="head"><h2>Bäckerei</h2><button class="x" data-a="close" aria-label="Schließen">✕</button></div>
    <div class="row"><span class="it">${ico('bread')}</span><div class="items"><b>Brot</b><span class="it ${S.inv.wheat<BREAD_COST?'miss':''}">${ico('wheat')}${BREAD_COST}</span><span style="color:#8a6a45;font-size:14px">${BAKE/1000} s</span></div>
    <button class="cta" data-a="bake" ${can?'':'disabled'}>Backen</button></div>
    <div class="slots">${slots.join('')}</div>
    ${S.bakery.done?`<div style="margin-top:12px;text-align:center"><button class="cta" data-a="collect">${S.bakery.done} Brot abholen</button></div>`:''}`}
  host.innerHTML=`<div class="sheet"><div class="card">${body}</div></div>`;
}
host.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,t=now();
  if(a==='close')close();
  if(a==='bake'){S.inv.wheat-=BREAD_COST;const q=S.bakery.queue;q.push((q.length?q[q.length-1]:t)+BAKE);pop(bak)}
  if(a==='collect')collectBread();
  if(a==='deliver'){const i=+b.dataset.i,o=S.orders[i];if(!has(o.items))return;
    for(const k in o.items)S.inv[k]-=o.items[k];S.coins+=o.coins;addXP(o.xp);toast(`Auftrag geliefert: +${o.coins} Münzen`);
    S.orders[i]=newOrder(S.level)}
  save();render()});

/* ---------- render loop ---------- */
let lastSheetKey='';
function render(){
  const t=now();tickBakery();
  document.getElementById('coins').textContent=S.coins;
  document.getElementById('lvl').textContent=S.level;
  document.getElementById('xpbar').style.width=Math.min(100,S.xp/(S.level*12)*100)+'%';
  const ready=S.orders.filter(o=>has(o.items)).length,bd=document.getElementById('ordBadge');bd.hidden=!ready;bd.textContent=ready;
  ents.forEach(e=>{let html='';const h=e.el.offsetHeight;
    if(e.kind==='field'){const f=S.fields[e.i],grow=f.readyAt>t;e.el.classList.toggle('growing',grow);e.el.classList.toggle('ready',!grow);
      if(grow)html=`<div class="timer" style="top:${h*.25}px"><span>${fmt(f.readyAt-t)}</span><span class="tbar"><i style="width:${100-(f.readyAt-t)/GROW*100}%"></i></span></div>`}
    else if(e.kind==='cow'){const c=S.cows[e.i];html=c.readyAt<=t?`<div class="bubble" style="top:-34px">${ico('milk')}</div>`:''}
    else if(e.kind==='bakery'){const q=S.bakery.queue;
      if(S.bakery.done)html=`<div class="bubble" style="top:-30px">${ico('bread')}</div>`;
      else if(q.length)html=`<div class="timer" style="top:-14px">${ico('bread').replace('<svg','<svg width="20" height="20"')}<span>${fmt(q[0]-t)}</span><span class="tbar"><i style="width:${100-(q[0]-t)/BAKE*100}%"></i></span></div>`;
      smokeHost.hidden=!q.length}
    if(e.ov.dataset.h!==html){e.ov.innerHTML=html;e.ov.dataset.h=html}});
  if(sheet){const key=sheet+JSON.stringify(S.inv)+JSON.stringify(S.bakery)+S.orders.length+Math.floor(t/1000);
    if(key!==lastSheetKey){lastSheetKey=key;renderSheet()}}
}
setInterval(()=>{render();},250);render();
</script>
