<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#0F2A3F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SBF-See">
<title>SBF-See Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Kopfleiste mit Reitern (Handy: Leiste unten), darunter eine schmale Lernspalte; Druckbögen als weiße A4-Blätter. */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#0F2A3F; --muted:#557083; --line:#D2DDE5;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FBE7DD;
  --sb:#1B7F46; --sb-soft:#DDF1E5; --mid:#B36B00; --mid-soft:#FBEBD2; --bb:#C02A2A; --bb-soft:#F9E0E0;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#BBBBBB;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --hdr:#0F2A3F; --hdr-ink:#EDF2F5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1620; --surface:#12222F; --ink:#E3EDF3; --muted:#8FA8BA; --line:#24394B;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2116;
  --sb:#43C27A; --sb-soft:#173426; --mid:#E9A93B; --mid-soft:#3A2C12; --bb:#F06868; --bb-soft:#3B1C1E; --hdr:#050E15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#12222F; --ink:#E3EDF3; --muted:#8FA8BA; --line:#24394B;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2116;
  --sb:#43C27A; --sb-soft:#173426; --mid:#E9A93B; --mid-soft:#3A2C12; --bb:#F06868; --bb-soft:#3B1C1E; --hdr:#050E15; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h2{font-size:1.7rem} h3{font-size:1.25rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top .bar{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.35rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:inherit;opacity:.75;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--hdr-ink) 16%,transparent)}
nav.tabs svg{width:18px;height:18px}
.sync{font-size:.75rem;opacity:.7;white-space:nowrap}
@media (min-width:761px) and (max-width:1120px){.sync{display:none}}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);
    justify-content:space-around;gap:0;z-index:6;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;flex:1;opacity:.6}
  nav.tabs button[aria-current="page"]{background:none;color:var(--accent);opacity:1}
  nav.tabs svg{width:22px;height:22px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  .sync{margin-left:auto}
}

main{max-width:1040px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--sb);border-color:var(--sb);color:var(--surface)}
.btn.mid{background:var(--mid);border-color:var(--mid);color:var(--surface)}
.btn.bad{background:var(--bb);border-color:var(--bb);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.88rem}
select,input[type=number],input[type=search]{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
label.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700}
label.field select,label.field input{color:var(--ink);font-weight:400;font-size:1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Übersicht */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.hero p{margin:6px 0 0;max-width:58ch}
@media (max-width:600px){.hero{grid-template-columns:1fr}}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.boxes .boxlink{border:1.5px solid transparent;border-radius:8px;padding:8px 6px;text-align:center;background:var(--bg);cursor:pointer}
.boxes .boxlink:hover:not([disabled]){border-color:var(--ink)}
.boxes .boxlink[disabled]{cursor:default;opacity:.6}
.boxes b{display:block;font-family:var(--f-mono);font-size:1.25rem}
.boxes span{font-size:.7rem;color:var(--muted);font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.examlist{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.examlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:.92rem}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--sb-soft);color:var(--sb)} .pill.no{background:var(--bb-soft);color:var(--bb)}
.pill.n,.pill.mk-n{background:var(--bg);color:var(--muted)}
.pill.warn{background:var(--mid-soft);color:var(--mid)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;color:var(--muted)}
.checks li.done{color:var(--ink)} .checks li.done>span:first-child{color:var(--sb);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px}
.cal span{font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal i.lf{background:transparent;border:1px dashed var(--line)}
.cal i.l1,.legend .lg1{background:color-mix(in srgb,var(--sb) 35%,var(--line))}
.cal i.l2,.legend .lg2{background:color-mix(in srgb,var(--sb) 70%,var(--line))}
.cal i.l3,.legend .lg3{background:var(--sb)}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
.pill.mk-s{background:var(--bb-soft);color:var(--bb)} .pill.mk-m{background:var(--mid-soft);color:var(--mid)} .pill.mk-g{background:var(--sb-soft);color:var(--sb)}
.markbar{display:inline-flex;gap:6px;flex-wrap:wrap}
.mk{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.mk:hover{border-color:var(--ink)}
.mk-s[aria-pressed="true"]{background:var(--bb);border-color:var(--bb);color:var(--surface)}
.mk-m[aria-pressed="true"]{background:var(--mid);border-color:var(--mid);color:var(--surface)}
.mk-o[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.mk-g[aria-pressed="true"]{background:var(--sb);border-color:var(--sb);color:var(--surface)}

/* Frage */
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:700}
.qtext{font-size:1.15rem;font-weight:700;margin:6px 0 0;line-height:1.4}
.qimg{display:block;width:100%;max-width:420px;aspect-ratio:3/2;object-fit:contain;border-radius:8px;background:#000;margin-top:14px}
.qimg.light{background:#fff;border:1px solid var(--line)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px;cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.right{border-color:var(--sb);background:var(--sb-soft)}
.opt.right .k{background:var(--sb);border-color:var(--sb);color:var(--surface)}
.opt.wrong{border-color:var(--bb);background:var(--bb-soft)}
.opt.wrong .k{background:var(--bb);border-color:var(--bb);color:var(--surface)}
.opt[disabled]{cursor:default}

/* Karteikarte */
.cardwrap{perspective:1600px}
.card{position:relative;min-height:340px;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--sb)}
.face .hint{margin-top:auto;padding-top:14px;font-size:.82rem;color:var(--muted)}
.answer{font-size:1.2rem;font-weight:700;color:var(--sb);margin-top:12px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate .btn{justify-content:center;padding:13px}
.boxbadge{font-family:var(--f-mono)}

/* Lernblatt / Papier */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 30px -12px rgba(0,0,0,.35);
  padding:clamp(18px,5vw,48px);max-width:820px;width:100%;margin:0 auto;font-size:.95rem}
.paper h3{font-size:1.3rem;color:var(--paper-ink)}
.paper .phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:8px;margin-bottom:14px;font-size:.85rem}
.pq{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--paper-line);break-inside:avoid}
.pq .t{font-weight:700;line-height:1.35}
.pq .t small{font-family:var(--f-mono);font-weight:500;color:#666;margin-left:6px}
.pq img{width:150px;max-width:30vw;aspect-ratio:3/2;object-fit:contain;background:#000;border-radius:3px}
.pq img.light{background:#fff;border:1px solid #ddd}
.pq ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:3px}
.pq li{display:grid;grid-template-columns:18px 1fr;gap:8px;line-height:1.35}
.pq li .cb{width:13px;height:13px;border:1.4px solid #333;margin-top:3px}
.pq .ans{margin-top:6px;color:#14632F;font-weight:700}
.pq .ans.hidden{color:transparent;text-shadow:0 0 9px rgba(20,99,47,.55);cursor:pointer;user-select:none}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 16px;font-family:var(--f-mono);font-size:.9rem;margin-top:10px}
.keypart{margin-top:22px;padding-top:12px;border-top:2px solid var(--paper-ink)}

/* Prüfung */
.examq{display:grid;gap:4px}
.examq + .examq{border-top:1px solid var(--line);padding-top:22px}
.stickyexam{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:760px){.stickyexam{top:calc(56px + env(safe-area-inset-top,0px))}}
.result{display:flex;gap:24px;flex-wrap:wrap;align-items:center}

/* Katalog */
.catlist{display:grid;gap:10px}
.catitem{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.catitem img{width:120px;aspect-ratio:3/2;object-fit:contain;background:#000;border-radius:6px}
.catitem img.light{background:#fff;border:1px solid var(--line)}
.catitem .a{color:var(--sb);font-weight:700;margin-top:4px}
@media (max-width:520px){.catitem{grid-template-columns:1fr}.catitem img{width:100%;max-width:260px}}

.confirm{border:2px solid var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.empty{padding:30px;text-align:center;color:var(--muted)}

@media print{
  @page{size:A4;margin:14mm}
  body::before,header.top,nav.tabs,.noprint,.toast{display:none!important}
  html,body{background:#fff!important}
  main{padding:0!important;max-width:none}
  .view>*:not(.printarea){display:none!important}
  .paper{box-shadow:none;padding:0;max-width:none;font-size:10.5pt}
  .pq img{width:44mm;max-width:none}
  .keypart{break-before:page}
  .pq .ans.hidden{color:#14632F;text-shadow:none}

}
</style>

</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 9v19M9 14h14M5 19c1 6 6 9 11 9s10-3 11-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>SBF-See Trainer</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
    <span class="sync" id="sync" title="Speicherort deines Lernstands"></span>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<script src="daten.js"></script>
<script src="app.js"></script>
</body>
</html>
